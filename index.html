<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CZ的个人主页</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f1ff, #f7f9fc);
            color: #263238;
        }

        .card {
            width: 80%;
            max-width: 700px;
            margin: 100px auto;
            padding: 50px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #1769aa;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .tag {
            display: inline-block;
            margin: 6px;
            padding: 8px 16px;
            color: white;
            background: #1769aa;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>你好，我是 CZ</h1>

        <p>
            欢迎来到我的个人主页！
        </p>

        <p>
            我目前就读于复旦大学金融专业硕士项目，
            研究方向为量化投资。
        </p>

        <div>
            <span class="tag">金融</span>
            <span class="tag">量化投资</span>
            <span class="tag">人工智能</span>
            <span class="tag">数据分析</span>
        </div>
    </div>
</body>
</html>
